<title>N4 Express</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&family=Noto+Serif+TC:wght@500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: a commuter-line course. Each hiragana row is a coloured "line", each week a station; content sits on cool exercise-book paper. */
:root{
  --paper:#F3F5F8; --surface:#FFFFFF; --sunk:#E9EDF3; --ink:#161D2B; --muted:#5B677A; --line:#D5DCE6; --grid:#C9D3E3;
  --accent:#2F5DA8; --accent-ink:#FFFFFF; --seal:#C8372D; --ok:#1F8A70; --okbg:#E3F3EE; --bad:#C8372D; --badbg:#FBE9E7; --warn:#B0812A;
  --hook-bg:#FFF8E6; --hook-line:#E2B33B; --hook-ink:#4A3A12;
  --r-a:#2F5DA8; --r-k:#1F8A70; --r-s:#B5651D; --r-t:#7A4FB5; --r-n:#C8372D; --r-h:#0E7C99; --r-m:#9C3D6B; --r-y:#5C7A1F; --r-r:#B0812A; --r-w:#4A5568;
  --f-display:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --f-kana:"Klee One","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E131C; --surface:#161D29; --sunk:#1D2533; --ink:#E6EBF2; --muted:#9AA6B8; --line:#2A3446; --grid:#334058;
  --accent:#7FA6E8; --accent-ink:#0E131C; --seal:#E36D5F; --ok:#4CBF9C; --okbg:#14302A; --bad:#EF7A6C; --badbg:#3A1C1A; --warn:#E0B25A;
  --hook-bg:#2A2413; --hook-line:#C99B2E; --hook-ink:#F1DFAE;
  --r-a:#7FA6E8; --r-k:#4CBF9C; --r-s:#E39A57; --r-t:#B08BE6; --r-n:#EF7A6C; --r-h:#4FB6D3; --r-m:#D877A6; --r-y:#9DBF55; --r-r:#E0B25A; --r-w:#A0AEC0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E131C; --surface:#161D29; --sunk:#1D2533; --ink:#E6EBF2; --muted:#9AA6B8; --line:#2A3446; --grid:#334058;
  --accent:#7FA6E8; --accent-ink:#0E131C; --seal:#E36D5F; --ok:#4CBF9C; --okbg:#14302A; --bad:#EF7A6C; --badbg:#3A1C1A; --warn:#E0B25A;
  --hook-bg:#2A2413; --hook-line:#C99B2E; --hook-ink:#F1DFAE;
  --r-a:#7FA6E8; --r-k:#4CBF9C; --r-s:#E39A57; --r-t:#B08BE6; --r-n:#EF7A6C; --r-h:#4FB6D3; --r-m:#D877A6; --r-y:#9DBF55; --r-r:#E0B25A; --r-w:#A0AEC0;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:clamp(26px,4.2vw,40px);font-weight:900;letter-spacing:-.01em}
h2{font-size:22px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono)}
.kana{font-family:var(--f-kana);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:58px}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.sign{display:grid;place-items:center;background:var(--seal);color:#fff;font-family:var(--f-display);font-weight:900;font-size:13px;
  border-radius:6px;padding:3px 7px;letter-spacing:.05em}
.brand b{font-family:var(--f-display);font-weight:900;font-size:18px;letter-spacing:-.01em}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:8px 12px;border-radius:8px;white-space:nowrap;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.tab .jp{font-family:var(--f-kana);font-weight:600;font-size:15px}
.tab .sub{font-size:10.5px;color:var(--muted);letter-spacing:.04em}
.tab[aria-selected="true"]{background:var(--sunk)}
.tab[aria-selected="true"] .en{color:var(--accent);font-weight:700}

section.view{padding-top:28px;display:grid;gap:28px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px}
.grid2>*,.grid3>*{min-width:0}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:500;display:inline-flex;gap:8px;align-items:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.small{padding:5px 10px;font-size:13px}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 11px;border-radius:999px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted))}
.play{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;flex-shrink:0}
.play:hover{border-color:var(--accent);color:var(--accent)}
.play svg{width:14px;height:14px}
.hook{background:var(--hook-bg);border-left:4px solid var(--hook-line);color:var(--hook-ink);border-radius:0 8px 8px 0;padding:12px 14px;font-size:14.5px;margin:0}
.hook::before{content:"Memory hook";display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.75;margin-bottom:2px}
.hook.cn::before{content:"Your Chinese shortcut"}
.pill{font-family:var(--f-mono);font-size:11px;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)} .pill.bad{background:var(--badbg);color:var(--bad)}
.scroll-x{overflow-x:auto}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;align-items:stretch}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.hero .lead{font-size:16.5px;max-width:60ch}
.ring{display:flex;gap:18px;align-items:center}
.ring svg{width:112px;height:112px;flex-shrink:0}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--sunk);border-radius:8px;padding:10px}
.stat b{display:block;font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}

/* timeline */
.tl{display:flex;height:46px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.tl div{display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:#fff;padding:0 4px;text-align:center;line-height:1.15;min-width:0}
.tlkey{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:8px 16px;margin-top:12px;font-size:13.5px}
.tlkey div{display:flex;gap:8px}
.tlkey i{width:12px;height:12px;border-radius:3px;margin-top:5px;flex-shrink:0}

/* route map */
.route svg{display:block;min-width:820px;width:100%;height:auto}
.route .st-label{font-family:var(--f-display);font-size:12.5px;font-weight:700;fill:var(--ink)}
.route .st-sub{font-size:11px;fill:var(--muted)}
.route .lock{fill:var(--muted)}
.syl{display:grid;gap:8px}
.syl details{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.syl summary{cursor:pointer;padding:10px 14px;display:flex;gap:12px;align-items:center;list-style:none}
.syl summary::-webkit-details-marker{display:none}
.syl .wk{font-family:var(--f-mono);font-weight:600;width:44px;flex-shrink:0;color:var(--muted)}
.syl .th{font-weight:700;flex:1;min-width:0}
.syl .body{padding:0 14px 14px 70px;display:grid;gap:6px;font-size:14px}
@media (max-width:600px){.syl .body{padding-left:14px}}
.syl dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0}
.syl dt{color:var(--muted);font-size:12.5px}
.syl dd{margin:0;min-width:0}

/* origins strip */
.origins{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px}
.og{border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center;background:var(--surface);border-top:3px solid var(--c)}
.og .src{font-size:15px;color:var(--muted);font-family:"Noto Serif TC","PMingLiU","Songti TC",serif;display:block;line-height:1.2}
.og .arr{font-size:10px;color:var(--muted);display:block;line-height:1}
.og .k{font-family:var(--f-kana);font-weight:600;font-size:24px;line-height:1.1;display:block}
.og .rm{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}

/* days */
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.day{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--surface);display:grid;gap:4px;align-content:start}
.day .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.1em}
.day b{font-size:14.5px}
.day p{font-size:13px;color:var(--muted)}
.day.gate{border-color:var(--seal);border-width:2px}

/* kana chart */
.chart-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:24px;align-items:start}
@media (max-width:900px){.chart-wrap{grid-template-columns:1fr}}
.gojuon{display:grid;gap:6px}
.gj-row{display:grid;grid-template-columns:62px repeat(5,minmax(0,1fr));gap:6px;align-items:stretch}
.gj-lab{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.gj-lab i{width:6px;align-self:stretch;border-radius:3px;background:var(--c)}
.kc{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 2px 4px;text-align:center;position:relative;min-height:64px}
.kc:hover{border-color:var(--c)}
.kc[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 2px var(--c)}
.kc .k{font-family:var(--f-kana);font-weight:600;font-size:clamp(22px,3.2vw,30px);line-height:1.15;display:block}
.kc .rm{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.kc .m{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--grid)}
.kc.empty{border:0;background:transparent}
.detail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);display:grid;gap:14px}
.dhead{display:flex;gap:16px;align-items:center}
.svgbox{width:150px;height:150px;flex-shrink:0;border:1px solid var(--grid);border-radius:8px;background:
  linear-gradient(var(--grid),var(--grid)) center/1px 100% no-repeat,
  linear-gradient(var(--grid),var(--grid)) center/100% 1px no-repeat,var(--surface);position:relative}
.svgbox svg{width:100%;height:100%}
.svgbox .num{font-family:var(--f-mono);font-size:7px;fill:var(--seal)}
.bigrom{font-family:var(--f-mono);font-size:28px;font-weight:600}
.origin{display:flex;align-items:center;gap:10px;font-size:14px}
.origin .src{font-family:"Noto Serif TC","PMingLiU","Songti TC",serif;font-size:30px;line-height:1}
.example{display:flex;gap:10px;align-items:center;background:var(--sunk);border-radius:8px;padding:10px 12px}
.example .k{font-family:var(--f-kana);font-weight:600;font-size:22px}
.mini-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.mini-grid .kc{min-height:58px}
.rule{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.rule .big{font-family:var(--f-kana);font-size:40px;font-weight:600;line-height:1}
.pairs{display:grid;gap:8px}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface)}
.pair .side{display:flex;gap:8px;align-items:center;min-width:0}
.pair .k{font-family:var(--f-kana);font-weight:600;font-size:20px}
.pair .vs{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.conf{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:10px}
.cf{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--surface);display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.cf .ks{font-family:var(--f-kana);font-weight:600;font-size:30px;letter-spacing:.1em;white-space:nowrap}
.cf p{font-size:13.5px}

/* drill */
.drill{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:24px;align-items:start}
@media (max-width:900px){.drill{grid-template-columns:1fr}}
.qcard{min-height:420px;display:grid;gap:18px;align-content:start}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:12px}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.prompt{display:grid;place-items:center;min-height:150px;text-align:center;gap:6px}
.prompt .k{font-family:var(--f-kana);font-weight:600;font-size:96px;line-height:1}
.prompt .w{font-family:var(--f-kana);font-weight:600;font-size:40px;line-height:1.2}
.prompt .rm{font-family:var(--f-mono);font-size:42px;font-weight:600}
.prompt .en{font-size:24px;font-weight:700}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:14px 10px;font-size:20px;font-weight:600;min-height:64px}
.opt.kan{font-family:var(--f-kana);font-size:30px}
.opt.romj{font-family:var(--f-mono)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.opt .key{font-family:var(--f-mono);font-size:10px;color:var(--muted);display:block;font-weight:500}
.typebox{display:flex;gap:10px}
.typebox input{flex:1;min-width:0;font-family:var(--f-mono);font-size:22px;padding:10px 14px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.typebox input.right{border-color:var(--ok)} .typebox input.wrong{border-color:var(--bad)}
.fb{border-radius:10px;padding:12px 14px;display:grid;gap:8px}
.fb.ok{background:var(--okbg);color:var(--ok)} .fb.no{background:var(--badbg);color:var(--bad)}
.fb .hook{margin-top:4px}
.mastery{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.ms{aspect-ratio:1;border-radius:5px;display:grid;place-items:center;font-family:var(--f-kana);font-weight:600;font-size:17px;background:var(--sunk);color:var(--muted)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{width:11px;height:11px;border-radius:3px}
.result{display:grid;place-items:center;text-align:center;gap:10px;padding:20px 0}
.result .score{font-family:var(--f-display);font-weight:900;font-size:64px;line-height:1}
.missed{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.missed span{font-family:var(--f-kana);font-weight:600;font-size:22px;border:1px solid var(--bad);color:var(--bad);border-radius:6px;padding:0 8px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
legend{font-size:12.5px;color:var(--muted);margin-bottom:6px;padding:0}

/* write */
.pad-wrap{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:760px){.pad-wrap{grid-template-columns:1fr}}
.pad{container-type:inline-size;position:relative;width:100%;max-width:320px;aspect-ratio:1;border:1px solid var(--grid);border-radius:10px;overflow:hidden;touch-action:none;background:var(--surface)}
.pad canvas{position:absolute;inset:0;width:100%;height:100%}
.pad .ghost{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-kana);font-weight:400;font-size:72cqw;line-height:1;color:var(--grid);pointer-events:none;user-select:none}
.pad .gl{position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(var(--grid),var(--grid)) center/1px 100% no-repeat,linear-gradient(var(--grid),var(--grid)) center/100% 1px no-repeat;opacity:.7}
.ruleslist{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.ruleslist li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.ruleslist .n{width:28px;height:28px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600}
.dl{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.thumb{border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface);font-size:12.5px}
.thumb b{display:block;font-family:var(--f-kana);font-size:18px}

/* learn */
.gcard{display:grid;gap:12px}
.gtitle{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.gtitle h3{font-family:var(--f-kana);font-size:24px;font-weight:600}
.exs{display:grid;gap:8px}
.ex{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;border-top:1px dashed var(--line);padding-top:8px}
.ex .jp{font-family:var(--f-kana);font-weight:600;font-size:18px}
.ex .rm{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.ex .en{font-size:13.5px}
.notes{margin:0;padding-left:18px;font-size:14px;display:grid;gap:3px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.big{font-family:"Noto Serif TC","PMingLiU",serif;font-size:22px}
td.jp{font-family:var(--f-kana);font-weight:600;font-size:18px}
td.m{font-family:var(--f-mono);font-size:13px}
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:8px}
.vi{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface)}
.vi .jp{font-family:var(--f-kana);font-weight:600;font-size:18px;line-height:1.3}
.vi .rm{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.vi .kj{font-family:"Noto Serif TC","PMingLiU",serif;font-size:14px;color:var(--muted);margin-left:6px}
.vi .en{font-size:13.5px}
.vi .hk{font-size:12.5px;color:var(--hook-ink);background:var(--hook-bg);border-radius:6px;padding:4px 8px;margin-top:4px}

/* speak */
.dlg{display:grid;gap:10px}
.line{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;border-radius:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line)}
.line.H{background:var(--sunk)}
.line.now{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-kana);font-weight:600;color:#fff;font-size:15px}
.av.T{background:var(--r-k)} .av.H{background:var(--r-a)}
.line .jp{font-family:var(--f-kana);font-weight:600;font-size:18.5px;line-height:1.4}
.line .rm{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.line .en{font-size:13.5px}
.hide-rm .line .rm{display:none} .hide-en .line .en{display:none} .hide-jp .line.H .jp{filter:blur(6px)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.steps{counter-reset:s;display:grid;gap:8px;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:10px;font-size:14px}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600}

/* library */
.res{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface)}
.res .ic{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:900;font-family:var(--f-display)}
.res b{display:block}
.res p{font-size:13.5px;color:var(--muted)}
.gatecard{border:2px solid var(--seal);border-radius:12px;padding:22px;background:var(--surface);display:grid;gap:12px}
.seal{width:72px;height:72px;border-radius:50%;border:3px solid var(--seal);color:var(--seal);display:grid;place-items:center;font-family:var(--f-kana);font-weight:600;font-size:22px;transform:rotate(-8deg);flex-shrink:0}
.sections5{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px}
.sections5 div{background:var(--sunk);border-radius:8px;padding:10px;font-size:13px}
.sections5 b{display:block;font-size:14.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.sync{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.on i{background:var(--ok)}
@media (max-width:560px){.sync{display:none}.opts{gap:8px}.prompt .k{font-size:80px}.dhead{flex-wrap:wrap}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* bilingual layer */
:root{ --f-zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif; }
.t-zh{font-family:var(--f-zh)}
body[data-lang="en"] .t-zh{display:none}
body[data-lang="zh"] .t-en{display:none}
body[data-lang="both"] .t-zh:not(.blk)::before{content:" · ";color:var(--muted);font-family:var(--f-body)}
body[data-lang="both"] .t-zh.blk{display:block;margin-top:4px}
body[data-lang="both"] p .t-zh.blk, body[data-lang="both"] .hook .t-zh.blk{opacity:.92}
body[data-lang="both"] h1 .t-zh.blk{font-size:.62em;font-weight:700;color:var(--muted);margin-top:6px}
body[data-lang="both"] h2 .t-zh:not(.blk)::before, body[data-lang="both"] h3 .t-zh:not(.blk)::before{content:"  "}
body[data-lang="both"] h2 .t-zh, body[data-lang="both"] h3 .t-zh{font-weight:500;color:var(--muted);font-size:.85em}
body[data-lang="zh"] .hook::before{content:"記憶鉤"}
body[data-lang="both"] .hook::before{content:"Memory hook · 記憶鉤"}
body[data-lang="zh"] .hook.cn::before{content:"中文捷徑"}
body[data-lang="both"] .hook.cn::before{content:"Your Chinese shortcut · 中文捷徑"}
.langseg{flex-shrink:0}
.langseg button{padding:5px 9px;font-size:12.5px}
.tab .sub .t-zh::before{content:none!important}
body[data-lang="both"] .tab .sub .t-zh{display:block;margin-top:1px}
.line .tr{font-size:13.5px}
.hide-en .line .tr{display:none}
.opt .t-zh.blk{font-size:.82em}
@media (max-width:560px){.brand b{display:none}}
section.view>*{min-width:0}
.seg{flex-wrap:wrap;max-width:100%}
.gj-lab .t-zh.blk{display:block}
.btn .t-zh.blk{display:inline}

as a particle is always read wa, never ha.","です makes the sentence polite. Drop it only with close friends.","Japanese drops what's obvious. \"Lin desu.\" alone means \"I'm Lin.\""],"ex":[["わたしは リンです。","Watashi wa Lin desu.","I am Lin."],["たなかさんは せんせいです。","Tanaka-san wa sensei desu.","Ms Tanaka is a teacher."],["わたしは かいしゃいんです。","Watashi wa kaishain desu.","I'm a company employee."]]},{"id":"ka","title":"〜か","rom":"...ka","meaning":"Question marker","hook":"か is a spoken question mark. Say it like raising your eyebrows: \"...desu KA?\" You don't change the word order, you just add か.","chinese":"Works exactly like 「嗎」: 你是學生嗎？ = がくせいですか。","notes":["Formal writing uses 。 rather than ？ after か.","Answer with はい (yes) or いいえ (no), then repeat the noun."],"ex":[["たなかさんは がくせいですか。","Tanaka-san wa gakusei desu ka.","Is Ms Tanaka a student?"],["はい、がくせいです。","Hai, gakusei desu.","Yes, she's a student."],["いいえ、せんせいです。","Iie, sensei desu.","No, she's a teacher."]]},{"id":"no","title":"A の B","rom":"A no B","meaning":"A's B / B of A","hook":"の is the Japanese 「的」. 我的名字 → わたしの なまえ. The owner comes first, just as in Chinese, so this one is free for you.","chinese":"Same order as 的: 日本語的老師 → にほんごの せんせい (Japanese-language teacher).","notes":["Unlike 的, の can't be dropped: わたし なまえ is wrong.","It links nouns: だいがくの せんせい = a university teacher."],"ex":[["わたしの なまえは リンです。","Watashi no namae wa Lin desu.","My name is Lin."],["にほんごの せんせい","nihongo no sensei","a teacher of Japanese"],["でんわばんごうは なんばんですか。","Denwa bangō wa nanban desu ka.","What is your phone number?"]]},{"id":"time","title":"Telling time: 〜じ / 〜じはん","rom":"...ji / ...ji han","meaning":"... o'clock / half past","hook":"じ = 時. Watch out for three irregular hours: 4 is よじ (not yonji), 7 is しちじ, 9 is くじ. Remember \"Four-seven-nine break the line\".","chinese":"三時半 is read さんじはん, almost word for word like 三點半.","notes":["ごぜん (a.m.) and ごご (p.m.) go BEFORE the time: ごご さんじ.","いま なんじですか。 = What time is it now?"],"ex":[["いま なんじですか。","Ima nanji desu ka.","What time is it now?"],["ごご さんじはんです。","Gogo sanji han desu.","It's 3:30 p.m."],["ごぜん くじです。","Gozen kuji desu.","It's 9 a.m."]]}],"gquiz":[["わたし＿ ホンです。","Watashi __ Hon desu.",["は","の","か"],0,"The topic marker は (read wa)."],["たなかさんは がくせいです＿。","Tanaka-san wa gakusei desu __. (question)",["か","は","の"],0,"か at the end turns it into a question."],["わたし＿ なまえは ホンです。","Watashi __ namae wa Hon desu.",["の","は","か"],0,"の links owner and thing, like 的."],["にほんご＿ せんせい","nihongo __ sensei",["の","は","です"],0,"\"Teacher of Japanese\" uses の."],["\"Is Ms Tanaka a teacher?\"","Choose the correct Japanese.",["たなかさんは せんせいですか。","たなかさんの せんせいですか。","せんせいは たなかさんか です。"],0,"Topic は, then noun, then です + か."],["いま＿＿ですか。","Ima ____ desu ka. (What time?)",["なんじ","なに","だれ"],0,"なんじ = what time."],["4 o'clock","Choose the correct reading.",["よじ","よんじ","しじ"],0,"4 o'clock is irregular: よじ."],["9 o'clock","Choose the correct reading.",["くじ","きゅうじ","きゅじ"],0,"9 o'clock is irregular: くじ."],["3:30 p.m.","Choose the correct Japanese.",["ごご さんじはん","さんじはん ごご","ごぜん さんじはん"],0,"ごご comes before the time, はん after."],["\"Yes, that's right.\"","Choose the correct reply.",["はい、そうです。","いいえ、そうです。","はい、そうですか。"],0,"そうですか means \"I see\", not \"that's right\"."]],"dialogue":[["T","はじめまして。たなかです。","Hajimemashite. Tanaka desu.","Nice to meet you. I'm Tanaka."],["H","はじめまして。リンです。よろしく おねがいします。","Hajimemashite. Lin desu. Yoroshiku onegaishimasu.","Nice to meet you. I'm Lin. Pleased to meet you."],["T","リンさんは シンガポールじんですか。","Lin-san wa Shingapōru-jin desu ka.","Are you Singaporean, Mr Lin?"],["H","いいえ、ホンコンから きました。","Iie, Honkon kara kimashita.","No, I'm from Ling Kong."],["T","そうですか。おしごとは なんですか。","Sō desu ka. O-shigoto wa nan desu ka.","I see. What's your job?"],["H","かいしゃいんです。ITの かいしゃです。","Kaishain desu. Ai-tī no kaisha desu.","I'm a company employee. An IT company."],["T","にほんごの がくせいですか。","Nihongo no gakusei desu ka.","Are you a student of Japanese?"],["H","はい、にほんごの がくせいです。","Hai, nihongo no gakusei desu." const Z = DATA.zh;
const PUB = !!DATA.pub; const ME = {k:DATA.me[0], en:DATA.me[1]};
const PARENT = (()=>{ if(!PUB || window.parent===window) return null;
  try{ if(window.parent.N4X_STORE) return window.parent.N4X_STORE; }catch(e){}
  // cross-domain: talk to the app shell with postMessage
  const waiting={}; let n=0;
  window.addEventListener('message',ev=>{ const m=ev.data; if(!m||m.type!=='n4x'||!waiting[m.id]) return; waiting[m.id](m.result); delete waiting[m.id]; });
  const call=(op,data)=>new Promise(res=>{ const id='q'+(++n); waiting[id]=res; window.parent.postMessage({type:'n4x',op,id,data},'*'); setTimeout(()=>{ if(waiting[id]){ delete waiting[id]; res(null); } },5000); });
  return { load:()=>call('load'), save:d=>call('save',d), gatePassed:(w,s)=>call('gatePassed',{week:w,score:s}) };
})();
const $ = (s, el=document) => el.querySelector(s);

const h = (tag, attrs={}, ...kids) => { const e=document.createElement(tag); for(const [k,v] of Object.entries(attrs||{})){ if(v==null||v===false) continue; if(k==='class') e.className=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v===true?'':v);} for(const kid of kids.flat()){ if(kid==null||kid===false) continue; e.append(kid.nodeType?kid:document.createTextNode(kid)); } return e; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

const Audio_ = { bank:null, loading:null, cur:null, rate:1,
  async load(){ if(this.bank) return; if(!this.loading) this.loading = fetch('audio/w1-audio.json').then(r=>r.json()).then(j=>{this.bank=j;}).catch(()=>{this.bank={};}); await this.loading; },
  id(text, male){ return DATA.aidx[(male?'m|':'f|')+text] || DATA.aidx['f|'+text] || DATA.aidx['m|'+text]; },
  async play(text, male, rate){ await this.load(); const id=this.id(text,male); const b=id&&this.bank[id];
    if(!b){ toast('No audio for this item yet.','這一項暫時沒有錄音。'); return; }
    if(this.cur){ this.cur.pause(); }
    const a=new Audio('data:audio/mpeg;base64,'+b); a.playbackRate=rate||this.rate; a.preservesPitch=true; this.cur=a;
    return new Promise(res=>{ a.onended=res; a.onerror=res; a.play().catch(res); }); }
};
const playBtn = (text, male, label) => h('button',{class:'play','aria-label':'Play '+(label||text),html:PLAYSVG,onclick:e=>{e.stopPropagation();Audio_.play(text,male);}});
